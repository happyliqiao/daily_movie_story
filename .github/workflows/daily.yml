name: 每日影视故事梗概

# 目标：北京时间上午出稿。GitHub 的 cron 用 UTC，且免费 runner 的 schedule
# 在高峰期会延迟数小时（实测设 09:07 曾延到 14:49 才跑），所以一天排 6 个时间点：
# 北京时间 09:07 / 11:07 / 13:07 / 15:07 / 17:07 / 19:07。
# 每次运行先检查今天是否已生成，已生成则秒退，不会重复发信。
on:
  schedule:
    - cron: "7 1,3,5,7,9,11 * * *"
  workflow_dispatch: # 也可以在页面上手动点「Run workflow」立刻跑一次

# 同一时间只允许一个任务在跑
concurrency:
  group: daily-movie-story
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: 生成故事梗概并发送邮件
    runs-on: ubuntu-latest
    # 免费模型（GLM-4-Flash）限 1 并发、速度也慢：实测 86 段约 23 分钟。
    # 超长剧（150+ 段）会到 40 分钟以上，这里留足余量。
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查今天是否已生成
        id: check
        run: |
          today=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "今天：$today"
          if ls output/${today}_*.md >/dev/null 2>&1; then
            echo "今天已有产出：$(ls output/${today}_*.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "今天还没有产出，继续生成"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成梗概并发邮件
        if: steps.check.outputs.skip != 'true'
        env:
          MOVIE_API_KEY: ${{ secrets.MOVIE_API_KEY }}
          MOVIE_API_BASE: ${{ secrets.MOVIE_API_BASE }}
          MOVIE_MODEL: ${{ secrets.MOVIE_MODEL }}
          MOVIE_OUTPUT_DIR: output
          MOVIE_SMTP_HOST: ${{ secrets.MOVIE_SMTP_HOST }}
          MOVIE_SMTP_PORT: ${{ secrets.MOVIE_SMTP_PORT }}
          MOVIE_SMTP_USER: ${{ secrets.MOVIE_SMTP_USER }}
          MOVIE_SMTP_PASS: ${{ secrets.MOVIE_SMTP_PASS }}
          MOVIE_SMTP_TO: ${{ secrets.MOVIE_SMTP_TO }}
          MOVIE_SMTP_SSL: "1"
        run: python run.py

      - name: 提交生成结果回仓库
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output data/state.json
          if git diff --staged --quiet; then
            echo "今天没有新内容，跳过提交"
          else
            git commit -m "chore: 更新 $(date +%Y-%m-%d) 的影视故事梗概"
            git pull --rebase origin master || true
            git push origin HEAD:master
          fi

      - name: 上传产物
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: movie-story-output
          path: output/
          retention-days: 30

  publish:
    name: 发布网页版到 gh-pages 分支
    needs: generate
    if: needs.generate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true # 网页发布失败不影响邮件
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: 准备站点目录（只允许 html 文件）
        run: |
          set -e
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp output/*.html /tmp/site/
          cp "output/索引.html" /tmp/site/index.html
          # 安全闸：站点目录里只允许 .html，出现任何其他文件就中止
          bad=$(find /tmp/site -type f ! -name '*.html' | head -5)
          if [ -n "$bad" ]; then
            echo "::error::站点目录出现非 html 文件，已中止：$bad"
            exit 1
          fi
          ls -la /tmp/site

      - name: 推送到 gh-pages 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd /tmp/site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish: 更新 $(date +%Y-%m-%d) 网页版"
          # gh-pages 是纯生成目录，每次全量覆盖
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          echo "已推送到 gh-pages"
